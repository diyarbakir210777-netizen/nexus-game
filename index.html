<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Game - Neon Racing</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080812;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  padding: 18px;
  background: #111122;
  font-size: 24px;
  font-weight: bold;
}

#game {
  position: relative;
  width: 360px;
  max-width: 95vw;
  height: 600px;
  margin: 20px auto;
  overflow: hidden;
  background:
    linear-gradient(90deg,
      #111 0 8%,
      #252535 8% 10%,
      #111 10% 90%,
      #252535 90% 92%,
      #111 92% 100%);
  border: 3px solid #00eaff;
  border-radius: 15px;
  box-shadow: 0 0 25px #00eaff;
}

.road-line {
  position: absolute;
  width: 6px;
  height: 70px;
  background: #ffffff;
  left: 50%;
  transform: translateX(-50%);
  opacity: .8;
}

.car {
  position: absolute;
  width: 50px;
  height: 85px;
  bottom: 30px;
  left: 155px;
  background: #ff1493;
  border-radius: 12px 12px 8px 8px;
  box-shadow: 0 0 20px #ff1493;
  z-index: 5;
}

.car::before {
  content: "";
  position: absolute;
  width: 30px;
  height: 32px;
  background: #55eaff;
  left: 10px;
  top: 10px;
  border-radius: 8px;
}

.car::after {
  content: "";
  position: absolute;
  width: 8px;
  height: 20px;
  background: #111;
  left: -5px;
  top: 20px;
  box-shadow: 52px 0 #111, 0 45px #111, 52px 45px #111;
}

.enemy {
  position: absolute;
  width: 50px;
  height: 80px;
  background: #ff3030;
  border-radius: 12px;
  box-shadow: 0 0 18px #ff3030;
  z-index: 4;
}

#score {
  font-size: 22px;
  margin: 10px;
}

#start {
  padding: 12px 25px;
  border: 0;
  border-radius: 10px;
  background: #00eaff;
  color: #001018;
  font-size: 18px;
  font-weight: bold;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin: 15px;
}

.controls button {
  width: 90px;
  height: 55px;
  border: 2px solid #00eaff;
  border-radius: 12px;
  background: #111122;
  color: white;
  font-size: 28px;
}
</style>
</head>

<body>

<header>🏎️ NEXUS GAME — NEON RACING</header>

<div id="score">Puan: 0</div>

<button id="start">OYUNU BAŞLAT</button>

<div id="game">
  <div class="car" id="car"></div>
</div>

<div class="controls">
  <button id="left">⬅️</button>
  <button id="right">➡️</button>
</div>

<script>
const game = document.getElementById("game");
const car = document.getElementById("car");
const scoreText = document.getElementById("score");
const startButton = document.getElementById("start");

let carX = 155;
let score = 0;
let running = false;
let enemies = [];
let speed = 4;
let gameLoop;

function createLines() {
  for (let i = 0; i < 6; i++) {
    const line = document.createElement("div");
    line.className = "road-line";
    line.style.top = (i * 120 - 70) + "px";
    game.appendChild(line);
  }
}

createLines();

function moveLeft() {
  if (!running) return;
  carX -= 25;

  if (carX < 20) {
    carX = 20;
  }

  car.style.left = carX + "px";
}

function moveRight() {
  if (!running) return;
  carX += 25;

  if (carX > 290) {
    carX = 290;
  }

  car.style.left = carX + "px";
}

document.getElementById("left").addEventListener("click", moveLeft);
document.getElementById("right").addEventListener("click", moveRight);

document.addEventListener("keydown", function(e) {
  if (e.key === "ArrowLeft") moveLeft();
  if (e.key === "ArrowRight") moveRight();
});

function createEnemy() {
  const enemy = document.createElement("div");
  enemy.className = "enemy";

  const x = Math.floor(Math.random() * 290) + 20;

  enemy.style.left = x + "px";
  enemy.style.top = "-90px";

  game.appendChild(enemy);
  enemies.push(enemy);
}

function collision(a, b) {
  const r1 = a.getBoundingClientRect();
  const r2 = b.getBoundingClientRect();

  return !(
    r1.right < r2.left ||
    r1.left > r2.right ||
    r1.bottom < r2.top ||
    r1.top > r2.bottom
  );
}

function endGame() {
  running = false;
  clearInterval(gameLoop);

  alert("Oyun bitti! Puanın: " + score);

  startButton.style.display = "inline-block";
}

function update() {
  if (!running) return;

  const lines = document.querySelectorAll(".road-line");

  lines.forEach(line => {
    let y = parseInt(line.style.top);
    y += speed;

    if (y > 600) {
      y = -70;
    }

    line.style.top = y + "px";
  });

  enemies.forEach((enemy, index) => {
    let y = parseInt(enemy.style.top);
    y += speed;

    enemy.style.top = y + "px";

    if (collision(car, enemy)) {
      endGame();
    }

    if (y > 620) {
      enemy.remove();
      enemies.splice(index, 1);
      score++;
      scoreText.textContent = "Puan: " + score;

      if (score % 10 === 0) {
        speed += 0.5;
      }
    }
  });
}

function startGame() {
  enemies.forEach(enemy => enemy.remove());
  enemies = [];

  score = 0;
  speed = 4;
  carX = 155;
  car.style.left = carX + "px";

  scoreText.textContent = "Puan: 0";
  running = true;

  startButton.style.display = "none";

  clearInterval(gameLoop);

  gameLoop = setInterval(update, 30);

  setInterval(() => {
    if (running) {
      createEnemy();
    }
  }, 1200);
}

startButton.addEventListener("click", startGame);
</script>

</body>
</html>
